<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GainTrace 云账本验证</title>
<style>
:root{font:16px system-ui;color:#163b2b;background:#f4f7f5}*{box-sizing:border-box}body{max-width:760px;margin:0 auto;padding:28px 18px 60px}h1{font-size:28px}h2{font-size:19px}.card{background:white;border:1px solid #dce5df;border-radius:14px;padding:18px;margin:16px 0}p{line-height:1.65}button,input,select{font:inherit}button{border:0;background:#176448;color:white;border-radius:8px;padding:10px 14px;cursor:pointer;margin:4px 4px 4px 0}button.secondary{background:#e7eee9;color:#163b2b}button:disabled{opacity:.5;cursor:wait}label{display:inline-block;margin:8px 12px 8px 0}input,select{max-width:140px;padding:8px;border:1px solid #becfc3;border-radius:6px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #edf0ee}.scroll{overflow-x:auto}.muted{color:#52665a;font-size:14px}#status{white-space:pre-wrap}[hidden]{display:none!important}.profit{color:#126544}.stats{display:flex;gap:24px;flex-wrap:wrap}.stats strong{font-size:22px;display:block;margin-top:4px}
</style></head>
<body><h1>GainTrace 云账本验证</h1><p class="muted">独立模拟测试 · client v0.2.0<br>只包含模拟股票和模拟交易。</p>
<section class="card"><h2>邮箱登录</h2><p id="status" role="status">正在检查登录状态…</p><button id="login" hidden>邮箱验证码登录</button><button id="logout" class="secondary" hidden>退出测试登录</button></section>
<main id="ledger" hidden>
<section class="card"><h2>云端连接</h2><p id="sync-status" role="status"></p><p class="muted">测试版刷新后需要重新登录。已保存的待同步模拟操作会在同一邮箱登录后恢复。</p><label><input id="offline" type="checkbox"> 模拟断网</label><button id="refresh" class="secondary">读取云端最新记录</button><button id="flush">同步待处理操作</button><button id="export" class="secondary">导出待同步记录</button><button id="seed" hidden>创建模拟账本</button></section>
<section id="contents" hidden>
<section class="card"><h2>模拟持仓</h2><div id="stats" class="stats"></div><p class="muted">固定模拟价格仅供验证显示；不是实时行情或正式收盘数据。</p><div class="scroll"><table><thead><tr><th>股票</th><th>股数</th><th>成本</th><th>已实现盈亏</th></tr></thead><tbody id="positions"></tbody></table></div></section>
<section class="card"><h2>添加模拟交易</h2><form id="trade-form"><label>股票 <select name="tc"><option value="us100002">模拟股票 2</option><option value="us100001">模拟股票 1</option></select></label><label>方向 <select name="side"><option value="B">买入</option><option value="S">卖出</option></select></label><label>价格 <input name="px" type="number" min="0.01" step="0.01" value="90" required></label><label>股数 <input name="qty" type="number" min="1" step="1" value="1" required></label><button type="submit">保存模拟交易</button></form><p class="muted">先保存到本机，再同步云端；断网时保留待同步操作。冲突时停止提交，保留两边记录供核对。</p></section>
<section class="card"><h2>模拟交易记录</h2><div class="scroll"><table><thead><tr><th>日期</th><th>股票</th><th>方向</th><th>价格</th><th>股数</th></tr></thead><tbody id="trades"></tbody></table></div></section>
<section class="card"><h2>云端日终记录</h2><p id="history-status" class="muted">此阶段先验证账本同步，日终调度将在下一阶段验收。</p><div id="history"></div></section>
</section></main><script type="module" src="/auth/ledger-client.mjs"></script></body></html>
