<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPEN BOOK">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<title>OPEN BOOK</title>
<style>
/* ============ 设计令牌 ============
   布局概念: 手机优先单列应用, 底部Tab导航, 卡片化信息层级
   色彩: 冷灰底 + 蓝色交互色 + 红涨绿跌语义色(可切换) */
:root{
  --bg:#f2f4f8; --card:#ffffff; --card2:#f6f7f9; --fg:#1b2430; --muted:#5f6a7a; --faint:#99a2af;
  --line:#e5e8ee; --line2:#d6dbe3;
  --accent:#2b5ce6; --accent-ink:#ffffff; --accent-soft:#e9eefd;
  --up:#d93025; --down:#0e9f6e; --up-bg:#fcebe9; --down-bg:#e5f6f0;
  --warn:#9a6700; --warn-bg:#fdf3df; --warn-line:#ecd9ac;
  --tab-bg:rgba(255,255,255,.93);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.07);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --card:#1a2028; --card2:#212836; --fg:#e9edf3; --muted:#9aa4b2; --faint:#6b7482;
    --line:#2a323e; --line2:#3a4451;
    --accent:#7a90f8; --accent-ink:#0f141b; --accent-soft:#252d49;
    --up:#e5484d; --down:#12a594; --up-bg:rgba(229,72,77,.16); --down-bg:rgba(18,165,148,.16);
    --warn:#d9a53f; --warn-bg:rgba(217,165,63,.15); --warn-line:rgba(217,165,63,.35);
    --tab-bg:rgba(15,20,27,.93);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --card:#1a2028; --card2:#212836; --fg:#e9edf3; --muted:#9aa4b2; --faint:#6b7482;
  --line:#2a323e; --line2:#3a4451;
  --accent:#7a90f8; --accent-ink:#0f141b; --accent-soft:#252d49;
  --up:#e5484d; --down:#12a594; --up-bg:rgba(229,72,77,.16); --down-bg:rgba(18,165,148,.16);
  --warn:#d9a53f; --warn-bg:rgba(217,165,63,.15); --warn-line:rgba(217,165,63,.35);
  --tab-bg:rgba(15,20,27,.93);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
/* 应用壳布局: body 恰好一屏高(100dvh 随工具栏动态调整)且自身不滚动,
   内容在 #main 内部滚动, #tabs 为文档流常驻底栏 —— 导航栏位置不随内容量/工具栏/键盘漂移 */
body{margin:0;font:14px/1.5 var(--font);background:var(--bg);color:var(--fg);
  height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button{cursor:pointer;font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#app{width:100%;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);flex:1;min-height:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
.view{display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
/* ---- 页头 ---- */
.pagehead{position:sticky;top:0;z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.ttl{font-size:20px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:11px;color:var(--faint);margin-top:1px}
.netbad{color:var(--warn);font-weight:600}
.iconbtn{width:36px;height:36px;flex:none;border-radius:10px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px}
/* ---- 卡片与列表 ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.poslist{display:flex;flex-direction:column;gap:10px}
.pos-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.pos-h h2{font-size:16px;font-weight:600;margin:0}
.pos-h span{font-size:11px;color:var(--faint)}
.pos-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.pr-l{flex:1;min-width:0}
.pr-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.pr-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{flex:none;font-size:10px;padding:1px 5px;border-radius:5px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.pr-sub{font-size:12px;color:var(--muted);margin-top:3px}
.pr-r{flex:none;text-align:right}
.pr-px{font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:6px;justify-content:flex-end}
.pr-val{font-size:12px;color:var(--muted);margin-top:3px}
.pr-val .pnl{font-weight:600}
.up{color:var(--up)}
.down{color:var(--down)}
.pill{font-size:11px;padding:1px 6px;border-radius:6px;font-weight:600}
.pill.up{color:var(--up);background:var(--up-bg)}
.pill.down{color:var(--down);background:var(--down-bg)}
/* ---- 汇总卡 ---- */
.sum .lbl{font-size:12px;color:var(--muted)}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum-grid .v{font-size:15px;font-weight:600;margin-top:2px}
.fx-line{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--faint)}
/* ---- 提示条 ---- */
.banner{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-line);
  color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5}
/* ---- 统计 ---- */
.tile-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .lbl{font-size:11px;color:var(--muted)}
.tile .v{font-size:20px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.tile .s{font-size:11px;color:var(--faint);margin-top:2px}
.twrap{overflow-x:auto}
.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11px;color:var(--faint);font-weight:500;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.t th:first-child,.t td:first-child{text-align:left}
.t td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
.t tr:last-child td{border-bottom:0}
.t .nm{font-weight:600}
.t tbody tr{cursor:pointer}
#st-chart{height:220px}
#st-donut{height:200px}
.dlegend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;padding:10px 4px 0;font-size:11px;color:var(--muted)}
.dlegend .dl{display:flex;align-items:center;gap:5px;min-width:0}
.dlegend .dl i{width:8px;height:8px;border-radius:3px;flex:none}
.dlegend .dl em{font-style:normal;color:var(--faint)}
/* ---- 分段控件 ---- */
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.14)}
.seg.side button.on[data-side="B"]{background:var(--up);color:#fff}
.seg.side button.on[data-side="S"]{background:var(--down);color:#fff}
.seg.mini{width:150px}
.seg.mini button{padding:5px 2px;font-size:12px}
.seg.set{width:196px;flex:none}
.seg.set button{font-size:12px;padding:6px 2px}
/* ---- 表单 ---- */
.f-lbl{font-size:12px;color:var(--muted);margin:14px 0 6px;display:block}
.f-lbl:first-child{margin-top:0}
.inp{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:15px}
.inp[type=date]{-webkit-appearance:none;appearance:none}
@media (pointer:coarse){.inp{font-size:16px}}  /* iOS: 输入框≥16px 防聚焦自动缩放 */
.inp:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--faint)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 网格子项允许收缩: 原生date/number控件固有最小宽度会把1fr轨道挤歪(iOS上尤为明显) */
.frow>div{min-width:0}
.sum-grid>div,.tile-row>.tile,.qgrid>div,.setrow>div:first-child{min-width:0}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.searchbox{position:relative}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);z-index:30;max-height:302px;overflow-y:auto}
.sugg .sg-tip{padding:10px 12px;font-size:12px;color:var(--faint)}
.sugg button{display:flex;width:100%;gap:8px;align-items:center;padding:10px 12px;background:none;border:0;text-align:left}
.sugg button:active{background:var(--card2)}
.sg-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.sg-code{font-size:12px;color:var(--faint);font-family:var(--mono)}
.picked{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-top:8px}
.pk-info{flex:1;min-width:0}
.pk-name{font-weight:600;font-size:14px}
.pk-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.amt-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:12px 2px 2px}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--fg);border-radius:11px;padding:10px 14px;font-size:14px;font-weight:500}
.btn:active{transform:scale(.97)}
.btn-primary{width:100%;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn-primary:active{transform:scale(.98)}
/* ---- 设置 ---- */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .sl{font-size:14px}
.setrow .sd{font-size:11px;color:var(--faint);margin-top:2px}
.sec-t{font-size:12px;color:var(--faint);font-weight:600;padding:2px 4px 0}
.help p{margin:6px 0;font-size:12px;color:var(--muted);line-height:1.7}
.help b{color:var(--fg);font-weight:600}
.footnote{font-size:11px;color:var(--faint);line-height:1.6;padding:0 4px}
/* ---- Tab 栏 ---- */
/* ---- Tab 栏(文档流常驻底栏, 负margin抵消body侧边距以贴边) ---- */
#tabs{flex:none;z-index:40;background:var(--tab-bg);
  -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
#tabs-in{max-width:560px;margin:0 auto;display:flex;padding:6px 10px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--faint);font-size:10px}
#tabs button.on{color:var(--accent)}
#tabs svg{width:22px;height:22px}
/* ---- 详情页 ---- */
#sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.sh-head{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;
  background:var(--bg);border-bottom:1px solid var(--line);
  width:100%;max-width:560px;margin:0 auto}
.sh-name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.sh-code{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:1px}
.sh-px{margin-left:auto;text-align:right;flex:none}
.sh-px .p{font-size:22px;font-weight:700}
.sh-px .c{font-size:12px}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  max-width:560px;width:100%;margin:0 auto}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.qgrid .l{font-size:10px;color:var(--faint)}
.qgrid .v{font-size:13px;font-weight:600;margin-top:1px}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ma-legend{display:flex;gap:10px;font-size:10px;font-family:var(--mono);padding:0 4px 6px;color:var(--muted);flex-wrap:wrap}
.ma-legend b{font-weight:600}
#kchart{height:340px;width:100%}
.kerr{padding:40px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.kerr .btn{margin-top:10px}
.trade-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.trade-row:last-child{border-bottom:0}
.bs{flex:none;width:22px;height:22px;border-radius:7px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bs.B{background:var(--up)}
.bs.S{background:var(--down)}
.tr-mid{flex:1;min-width:0}
.tr-px{font-size:13px;font-weight:600}
.tr-sub{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-amt{text-align:right;font-size:12px;color:var(--muted);flex:none}
.tr-amt .b2{color:var(--faint);font-size:10px;display:block}
.del{border:0;background:none;color:var(--faint);padding:6px;flex:none;font-size:12px}
.del.arm{color:var(--up);font-weight:600}
/* ---- Toast / Modal ---- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13px;z-index:100;
  box-shadow:var(--shadow);max-width:86vw;text-align:center}
#modal{position:fixed;inset:0;z-index:110;background:rgba(8,12,18,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:var(--card);border-radius:16px;max-width:420px;width:100%;padding:18px;box-shadow:var(--shadow);
  max-height:82vh;display:flex;flex-direction:column;gap:12px}
.modal-card h3{margin:0;font-size:16px}
.modal-card textarea{width:100%;height:170px;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:10px;font:12px/1.45 var(--mono);resize:none}
.modal-acts{display:flex;gap:10px}
.modal-acts .btn{flex:1}
.modal-acts .btn-primary{width:auto}
/* ---- 桌面端(鼠标+宽屏)适配 ---- */
@media (min-width:700px) and (pointer:fine){
  #app{border-inline:1px solid var(--line)}
  /* 详情页呈现为居中对话框(触屏设备保持全屏) */
  #sheet{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);
    width:560px;max-width:calc(100vw - 48px);
    height:min(780px,calc(100vh - 96px));height:min(780px,calc(100dvh - 96px));
    border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  #sheet::before{content:"";position:fixed;inset:0;background:rgba(8,12,18,.45)}
}
@media (hover:hover) and (pointer:fine){
  .pos-row:hover,.btn:hover,.iconbtn:hover{border-color:var(--line2)}
  .sugg button:hover{background:var(--card2)}
  .t tbody tr:hover{background:var(--card2)}
  #tabs button:hover{color:var(--muted)}
}
@media (pointer:fine){
  .inp[type=date]::-webkit-calendar-picker-indicator{display:block;opacity:.6;cursor:pointer}
}
/* ---- 空状态 ---- */
.empty{padding:46px 16px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:10px}
.empty p{margin:0 0 4px;font-size:14px}
.empty .s{font-size:12px;color:var(--faint)}
.empty .btn{margin-top:16px}
</style>
</head>
<body>
<div id="app">
  <main id="main">
    <section class="view" id="v-pos"></section>
    <section class="view" id="v-add" hidden>
      <div class="pagehead"><div style="flex:1"><div class="ttl">记一笔</div><div class="sub">手动录入 · 自动汇总持仓与统计</div></div></div>
      <div class="card">
        <label class="f-lbl" for="f-q">股票</label>
        <div class="searchbox">
          <input class="inp" id="f-q" placeholder="名称 / 拼音 / 代码，如 茅台、AAPL" autocomplete="off">
          <div class="sugg" id="f-sugg" hidden></div>
        </div>
        <div class="picked" id="f-pick" hidden>
          <div class="pk-info"><div class="pk-name" id="pk-name"></div><div class="pk-sub" id="pk-sub"></div></div>
          <button class="btn" id="f-usepx" type="button">用现价</button>
          <button class="iconbtn" id="f-unpick" type="button" aria-label="取消选择">✕</button>
        </div>
        <label class="f-lbl">方向</label>
        <div class="seg side" id="f-side">
          <button type="button" data-side="B" class="on">买入</button>
          <button type="button" data-side="S">卖出</button>
        </div>
        <div class="frow">
          <div><label class="f-lbl" for="f-px">价格</label><input class="inp num" id="f-px" type="number" inputmode="decimal" step="any" min="0" placeholder="0.00"></div>
          <div><label class="f-lbl" for="f-qty">数量（股）</label><input class="inp num" id="f-qty" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
        </div>
        <div class="frow">
          <div><label class="f-lbl" for="f-fee">手续费（可选）</label><input class="inp num" id="f-fee" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
          <div><label class="f-lbl" for="f-date">日期</label><input class="inp num" id="f-date" type="date"></div>
        </div>
        <label class="f-lbl" for="f-broker">券商 / 平台</label>
        <input class="inp" id="f-broker" list="f-brokers" placeholder="如 华泰、富途、长桥、IB" autocomplete="off">
        <datalist id="f-brokers"></datalist>
        <label class="f-lbl" for="f-note">备注（可选）</label>
        <input class="inp" id="f-note" placeholder="如 回调加仓 / 止盈减仓" autocomplete="off">

/* ===== CORE: 纯逻辑（无 DOM 依赖），便于单元测试 ===== */
const Core = (() => {
  const pad = n => String(n).padStart(2, '0');
  const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const todayStr = () => dstr(new Date());
  const weekStartStr = () => { const d = new Date(); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return dstr(d); };
  const monthStartStr = () => new Date().getFullYear() + '-' + pad(new Date().getMonth() + 1) + '-01';
  const yearStartStr = () => new Date().getFullYear() + '-01-01';

  const FX_FALLBACK = { USDCNY: 7.20, HKDCNY: 0.92 };       // 汇率不可用时的备用近似值
  const CUR_OF = { sh: 'CNY', sz: 'CNY', hk: 'HKD', us: 'USD' };
  const EPS = 1e-9;

  function toCnyMap(fx) {
    return { CNY: 1, USD: (fx && fx.USDCNY) || FX_FALLBACK.USDCNY, HKD: (fx && fx.HKDCNY) || FX_FALLBACK.HKDCNY };
  }
  /* 任意币种金额按当前汇率折算到基准币种: 先折成人民币再除以目标币种汇率 */
  function toBase(amt, from, base, fx) {
    if (from === base) return amt;
    const m = toCnyMap(fx);
    return amt * m[from] / m[base];
  }

  /* 持仓计算: 移动加权平均成本法（手续费入成本）; 卖出产生已实现盈亏。
     多空对称账本: cost 与 shares 同号(空头时均为负, avg=cost/shares 恒为正的均价),
     因此"先卖后买"(做空或补录历史交易)与"先买后卖"结果一致。 */
  function calcPositions(trades) {
    const map = new Map();
    const sorted = [...trades].sort((a, b) => a.date === b.date ? (a.ts || 0) - (b.ts || 0) : (a.date < b.date ? -1 : 1));
    for (const t of sorted) {
      let p = map.get(t.tc);
      if (!p) {
        p = { tc: t.tc, mkt: t.mkt, code: t.code, name: t.name, cur: t.cur || CUR_OF[t.mkt] || 'CNY',
          shares: 0, cost: 0, avg: 0, realized: 0, trades: [] };
        map.set(t.tc, p);
      }
      p.trades.push(t);
      if (t.side === 'B') {
        const short = Math.min(t.qty, Math.max(-p.shares, 0));   // 先买回平空的部分
        const longQ = t.qty - short;
        if (short > 0) { p.realized += (p.avg - t.px) * short; p.cost += p.avg * short; p.shares += short; }
        p.cost += t.px * longQ + (t.fee || 0);
        p.shares += longQ;
      } else {
        const longQ = Math.min(t.qty, Math.max(p.shares, 0));    // 先卖出减多的部分
        const shortQ = t.qty - longQ;
        if (longQ > 0) { p.realized += (t.px - p.avg) * longQ; p.cost -= p.avg * longQ; p.shares -= longQ; }
        if (shortQ > 0) { p.cost -= t.px * shortQ; p.shares -= shortQ; }
        p.realized -= (t.fee || 0);
      }
      if (Math.abs(p.shares) < EPS) { p.shares = 0; p.cost = 0; p.avg = 0; }
      else { p.avg = p.cost / p.shares; }
    }
    return [...map.values()].sort((a, b) =>
      String(b.trades[b.trades.length - 1].date).localeCompare(String(a.trades[a.trades.length - 1].date)));   // 最近交易的排前面
  }

  /* 周期统计: 各币种原始金额分桶, 由 UI 层按当前汇率折算 */
  function calcStats(trades, startStr) {
    const inP = trades.filter(t => t.date >= startStr);
    const bucket = () => ({ CNY: 0, USD: 0, HKD: 0, n: 0 });
    const buy = bucket(), sell = bucket();
    const byStock = new Map(), byBroker = new Map(), monthly = new Map();
    const nowY = new Date().getFullYear();
    for (const t of inP) {
      const cur = t.cur || CUR_OF[t.mkt] || 'CNY';
      const amt = t.px * t.qty;
      const gross = t.side === 'B' ? amt + (t.fee || 0) : amt - (t.fee || 0);
      const dst = t.side === 'B' ? buy : sell;
      dst[cur] += gross; dst.n++;
      const sk = byStock.get(t.tc) || { tc: t.tc, name: t.name, mkt: t.mkt, buy: { CNY: 0, USD: 0, HKD: 0 }, sell: { CNY: 0, USD: 0, HKD: 0 } };
      (t.side === 'B' ? sk.buy : sk.sell)[cur] += gross;
      byStock.set(t.tc, sk);
      const bk = (t.broker || '').trim();
      if (bk) {
        const br = byBroker.get(bk) || { broker: bk, buy: { CNY: 0, USD: 0, HKD: 0 }, sell: { CNY: 0, USD: 0, HKD: 0 } };
        (t.side === 'B' ? br.buy : br.sell)[cur] += gross;
        byBroker.set(bk, br);
      }
      if (+t.date.slice(0, 4) === nowY) {
        const mk = t.date.slice(0, 7);
        const mo = monthly.get(mk) || { m: mk, buy: { CNY: 0, USD: 0, HKD: 0 }, sell: { CNY: 0, USD: 0, HKD: 0 } };
        (t.side === 'B' ? mo.buy : mo.sell)[cur] += gross;
        monthly.set(mk, mo);
      }
    }
    return { buy, sell, n: inP.length, stocks: [...byStock.values()],
      brokers: [...byBroker.values()], monthly: [...monthly.values()].sort((a, b) => a.m < b.m ? -1 : 1) };
  }

  return { pad, dstr, todayStr, weekStartStr, monthStartStr, yearStartStr,
    toBase, toCnyMap, calcPositions, calcStats, CUR_OF, FX_FALLBACK };
})();

/* ===== 网络基础 ===== */
async function fjson(url, ms) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms || 8000);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function ftext(url, ms, enc) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms || 8000);
  try {
    const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status);
    return new TextDecoder(enc || 'utf-8').decode(await r.arrayBuffer());
  } finally { clearTimeout(t); }
}

/* ===== 腾讯行情解析 =====
   响应为 v_代码="字段~字段~..." 的 GBK 文本, 关键位: [1]名称 [3]现价 [4]昨收 [31]涨跌额 [32]涨跌幅 */
function parseQtText(txt) {
  const out = { quotes: null, fx: null };
  const re = /v_([A-Za-z0-9_.]+)="([^"]*)"/g; let m;
  while ((m = re.exec(txt))) {
    const code = m[1], f = m[2].split('~');
    if (code.startsWith('wh')) {
      if (f.length > 4 && +f[3] > 0) { out.fx = out.fx || {}; out.fx[code.slice(2)] = +f[3]; }
      continue;
    }
    if (f.length < 36) continue;
    const px = +f[3]; if (!(px > 0)) continue;
    (out.quotes = out.quotes || {})[code] = { px, prev: +f[4] || px, open: +f[5] || 0, hi: +f[33] || 0, lo: +f[34] || 0, chg: +f[31] || 0, pct: +f[32] || 0, name: f[1] || '' };
  }
  return out;
}

/* ===== K线 ===== */
async function fetchKline(tc, period, count) {
  const url = 'https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=' + tc + ',' + period + ',,,' + count + ',qfq';
  const j = await fjson(url);
  const d = j && j.data && j.data[tc]; if (!d) return null;
  const rows = d['qfq' + period] || d[period]; if (!rows || !rows.length) return null;
  const k = rows.map(r => ({ d: r[0], o: +r[1], c: +r[2], h: +r[3], l: +r[4], v: +r[5] })).filter(r => isFinite(r.o) && isFinite(r.c));
  const qt = d.qt && d.qt[tc];
  return { k, qt };
}

/* ===== 美股( qt.gtimg 不支持, 走 ifzq 的 qt 段, 延时行情 ) ===== */
async function usQuote(tc) {
  try {
    const r = await fetchKline(tc, 'day', 1);
    if (r && r.qt) {
      const q = r.qt, px = +q[3];
      if (px > 0) return { px, prev: +q[4] || px, open: +q[5] || 0, hi: +q[33] || 0, lo: +q[34] || 0, chg: +q[31] || 0, pct: +q[32] || 0, name: q[1] || '', delayed: true };
    }
  } catch (e) {}
  return null;
}
/* 美股交易所后缀自动探测: 错误后缀只回 1 根K线; 可带已知后缀优先(NYSE=N, NASDAQ=OQ, Arca/AMEX=AM) */
async function resolveUS(sym, prefSuf) {
  const sufs = [...new Set([prefSuf, 'OQ', 'N', 'AM'].filter(Boolean))];
  for (const suf of sufs) {
    const tc = 'us' + sym + '.' + suf;
    try {
      const r = await fetchKline(tc, 'day', 5);
      if (r && r.k.length >= 2) return { tc, code: sym + '.' + suf, mkt: 'us', name: (r.qt && r.qt[1]) || sym };
    } catch (e) {}
  }
  return null;
}

/* ===== 搜索( smartbox JSONP, 无 CORS 头故走 script 标签 ) ===== */
let searchChain = Promise.resolve();
function smartSearch(q) {
  const run = () => rawSearch(q);
  const p = searchChain.then(run, run);
  searchChain = p.catch(() => {});
  return p;
}
function rawSearch(q) {
  return new Promise(res => {
    const s = document.createElement('script'); let done = false;
    const finish = v => {
      if (done) return; done = true; clearTimeout(tm); s.remove();
      try { delete window.v_hint; } catch (e) { window.v_hint = undefined; }
      res(v);
    };
    const tm = setTimeout(() => finish([]), 6000);
    s.onload = () => { let out = []; try { out = parseHint(window.v_hint); } catch (e) {} finish(out); };
    s.onerror = () => finish(null);
    s.src = 'https://smartbox.gtimg.cn/s3/?v=2&q=' + encodeURIComponent(q) + '&t=all';
    document.head.appendChild(s);
  });
}
/* smartbox 返回格式(实测): 首条5字段[市场~代码~名称~拼音~类型], 其余条目4字段[代码~名称~拼音~类型]。
   类型后缀市场信息不可靠, 市场主要由代码形状推断; 白名单保留 股票GP/场内基金ETF,LOF */
function parseHint(h) {
  if (!h || h.indexOf('none_match') >= 0) return [];
  const g = h.split('~');
  const out = [];
  const keep = ty => /^(GP|ETF|LOF)/.test(ty);
  const tyOf = ty => ty.indexOf('ETF') === 0 ? 'ETF' : ty.indexOf('LOF') === 0 ? 'LOF' : '';
  const mktOf = (code, ty) => {
    if (/^\d{6}$/.test(code)) {
      if (/^(60|68|51|56|58|50)/.test(code)) return 'sh';
      if (/^(00|30|15|16)/.test(code)) return 'sz';
      const m = /\^(\w+)$/.exec(ty);
      return (m && (m[1] === 'sh' || m[1] === 'sz')) ? m[1] : null;
    }
    if (/^\d{1,5}$/.test(code)) return 'hk';
    if (/^[A-Za-z]/.test(code)) return 'us';
    return null;
  };
  const push = (mkt, code, name, ty) => {
    if (!mkt || !keep(ty) || !code) return;
    out.push({ mkt, code, tc: mkt + code, name, ty: tyOf(ty) });
  };
  let i = 0;
  if (g.length >= 5 && ['sh', 'sz', 'hk', 'us'].indexOf(g[0]) >= 0) {
    push(g[0], g[1], g[2], g[4]);
    i = 5;
  }
  for (; i + 3 < g.length; i += 4) {
    push(mktOf(g[i], g[i + 3]), g[i], g[i + 1], g[i + 3]);
    if (out.length >= 10) break;
  }
  return out;
}

/* ===== 手输6位代码直判(股票+场内基金前缀; 未知前缀返回null由调用方走搜索) ===== */
function directTc(raw) {
  raw = String(raw || '').trim();
  if (!/^\d{6}$/.test(raw)) return null;
  if (/^(60|68)/.test(raw)) return { tc: 'sh' + raw, code: raw, mkt: 'sh' };
  if (/^(00|30)/.test(raw)) return { tc: 'sz' + raw, code: raw, mkt: 'sz' };
  if (/^(51|56|58|50)/.test(raw)) return { tc: 'sh' + raw, code: raw, mkt: 'sh' };   // 沪 ETF/LOF
  if (/^(15|16)/.test(raw)) return { tc: 'sz' + raw, code: raw, mkt: 'sz' };         // 深 ETF/LOF
  if (/^(43|83|87|92)/.test(raw)) return { err: '北交所代码暂不支持，当前仅支持沪深港美' };
  return null;
}

/* ===== 行情批量刷新 ===== */
let refreshing = false;
async function refreshQuotes() {
  if (refreshing) return;
  refreshing = true; if (onBusy) onBusy(true);
  const tcs = activeTcs();
  const ah = tcs.filter(t => /^(sh|sz|hk)/.test(t));
  const us = tcs.filter(t => /^us/.test(t));
  const fxStale = !fx || !fx.ts || (Date.now() - fx.ts > 10 * 60 * 1000);
  let any = false;
  if (ah.length || fxStale) {
    const list = ah.slice();
    if (fxStale) list.push('whUSDCNY', 'whHKDCNY');
    try {
      const txt = await ftext('https://qt.gtimg.cn/q=' + list.join(','), 9000, 'gbk');
      const p = parseQtText(txt);
      if (p.quotes) { const now = Date.now(); for (const k in p.quotes) quotes[k] = Object.assign({ ts: now }, p.quotes[k]); saveQuotes(); any = true; }
      if (p.fx && p.fx.USDCNY > 0 && p.fx.HKDCNY > 0) {
        fx = { USDCNY: p.fx.USDCNY, HKDCNY: p.fx.HKDCNY, ts: Date.now(), approx: false }; saveFx(); any = true;
      }
    } catch (e) {}
  }
  for (const tc of us) { const q = await usQuote(tc); if (q) { quotes[tc] = Object.assign({ ts: Date.now() }, q); any = true; } }
  if (us.length) saveQuotes();
  if (!fx) {   // 汇率兜底: er-api 免费无 key
    try {
      const j = await fjson('https://open.er-api.com/v6/latest/USD', 9000);
      if (j && j.rates && j.rates.CNY && j.rates.HKD) {
        fx = { USDCNY: j.rates.CNY, HKDCNY: j.rates.CNY / j.rates.HKD, ts: Date.now(), approx: true }; saveFx(); any = true;
      }
    } catch (e) {}
  }
  net = { ok: any, at: Date.now() };
  refreshing = false; if (onBusy) onBusy(false);
  if (onData) onData();
}

/* 大金额紧凑显示: ≥1亿用亿、≥10万用万, 防止统计块与表格在窄屏溢出 */
function fmtAmtC(v, cur, sign) {

  if (a >= 1e8) return sg + s + (a / 1e8).toFixed(2) + '亿';
  if (a >= 1e5) return sg + s + (a / 1e4).toFixed(2) + '万';
  return sg + s + a.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

}

function compactNum(v) { if (!v) return '0'; const a = Math.abs(v); if (a >= 1e8) return (v / 1e8).toFixed(1) + '亿'; if (a >= 1e4) return (v / 1e4).toFixed(0) + '万'; return String(Math.round(v)); }

function hideSugg() { const s = $('#f-sugg'); if (s) { s.hidden = true; s.innerHTML = ''; } }
function showSuggTip(t) { const s = $('#f-sugg'); s.hidden = false; s.innerHTML = '<div class="sg-tip">' + esc(t) + '</div>'; }
function renderSugg(list) {
  const s = $('#f-sugg');
  if (!list || !list.length) { showSuggTip('无匹配结果，试试拼音或代码'); return; }
  s.hidden = false;
  s.innerHTML = list.map(r => `<button type="button" data-tc="${esc(r.tc)}"><span class="sg-name">${esc(r.name)} <span class="tag">${MKT_TAG[r.mkt] || ''}${r.ty ? '·' + r.ty : ''}</span></span><span class="sg-code">${esc(r.code)}</span></button>`).join('');

    $('#f-q').value = ''; hideSugg();
    fetchOneQuote(r.tc);
  });

function fetchOneQuote(tc) {
  if (/^us/.test(tc)) {
    usQuote(tc).then(q => { if (q) { quotes[tc] = Object.assign({ ts: Date.now() }, q); saveQuotes(); renderPicked(); } });
  } else {
    ftext('https://qt.gtimg.cn/q=' + tc, 6000, 'gbk')
      .then(txt => { const p = parseQtText(txt); if (p.quotes && p.quotes[tc]) { quotes[tc] = Object.assign({ ts: Date.now() }, p.quotes[tc]); saveQuotes(); renderPicked(); } })
      .catch(() => {});
  }
}
async function pickTc(tc) {
  const mkt = (/^(sh|sz|hk|us)/.exec(tc) || [])[1] || 'sh';
  const cd = tc.slice(2);
  const base = { tc, code: cd, mkt, name: cd, cur: Core.CUR_OF[mkt],
    ty: /^(51|56|58|15)/.test(cd) ? 'ETF' : /^(50|16)/.test(cd) ? 'LOF' : '' };
  setPicked(base); hideSugg(); $('#f-q').value = '';
  try {
    if (mkt === 'us') { const q = await usQuote(tc); if (q) { quotes[tc] = Object.assign({ ts: Date.now() }, q); saveQuotes(); } }
    else {
      const txt = await ftext('https://qt.gtimg.cn/q=' + tc, 6000, 'gbk');
      const p = parseQtText(txt); const qq = p.quotes && p.quotes[tc];
      if (!qq) { setPicked(null); showToast('未找到该代码，请检查'); return; }
      quotes[tc] = Object.assign({ ts: Date.now() }, qq); saveQuotes();
    }
  } catch (e) { /* 离线: 保留代码形式的选择 */ }
  const q = quotes[tc];
  if (q && q.name) setPicked(Object.assign({}, base, { name: q.name }));
  renderPicked();
}
async function doSearch(v) {
  showSuggTip('搜索中…');
  const r = await smartSearch(v);
  if (r === null) { showSuggTip('搜索失败 — 网络受限或离线，可直接输入代码'); return; }
  if (!r.length) {
    const m = /^([A-Za-z]{1,6})(?:\.([A-Za-z]{1,2}))?$/.exec(v);   // smartbox 未收录的美股代码 → 直连兜底
    if (m) { await tryUS(m[1].toUpperCase(), m[2] ? m[2].toUpperCase() : null); return; }
    showSuggTip('无匹配结果，试试拼音或代码');
    return;
  }
  renderSugg(r);
}
async function tryUS(sym, suf) {
  showSuggTip('识别美股代码 ' + sym + ' …');
  const r = await resolveUS(sym, suf);
  if (!r) { showSuggTip('无匹配结果，试试拼音或代码'); return; }
  setPicked({ tc: r.tc, code: r.code, mkt: 'us', name: r.name || r.code, cur: 'USD', ty: '' });
  $('#f-q').value = ''; hideSugg();
  fetchOneQuote(r.tc);
}
/* 输入路由: 完整6位数字(已知前缀)直连; 其余(不完整数字/字母/中文/拼音)走搜索建议列表 */
let qDeb = null;
function qInput(now) {
  const v = $('#f-q').value.trim();

  if (!v) { hideSugg(); return; }
  qDeb = setTimeout(() => {
    if (/^\d{6}$/.test(v)) {

      if (d && d.err) { showSuggTip(d.err); return; }

  const t = { id: uid(), date, tc: picked.tc, mkt: picked.mkt, code: picked.code, name: picked.name || picked.code, cur: picked.cur, side, px, qty, fee, broker, note, ts: Date.now() };

function renderStatsDonut(st, mode) {

  const lg = $('#st-dlegend');
  if (!window.echarts) { elm.innerHTML = '<div class="kerr" style="padding:24px 8px">图表组件加载失败（需联网）</div>'; if (lg) lg.innerHTML = ''; return; }
  const F = fxInfo();
  const items = st.stocks.map(sk => ({
    name: sk.name,
    v: ['CNY', 'USD', 'HKD'].reduce((a, c) => a + Core.toBase((mode === 'buy' ? sk.buy : sk.sell)[c] || 0, c, S.base, F), 0)
  })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  if (!items.length) {
    elm.innerHTML = '<div class="kerr" style="padding:24px 8px">本期无' + (mode === 'buy' ? '买入' : '卖出') + '</div>';
    if (lg) lg.innerHTML = '';
    return;
  }
  const pal = CAT[isDark() ? 'dark' : 'light'];
  const data = items.slice(0, 6).map((x, i) => ({ name: x.name, value: Math.round(x.v * 100) / 100, itemStyle: { color: pal[i] } }));
  const rest = items.slice(6);
  if (rest.length) data.push({ name: '其他', value: Math.round(rest.reduce((a, x) => a + x.v, 0) * 100) / 100, itemStyle: { color: '#898781' } });
  const total = items.reduce((a, x) => a + x.v, 0);
  const label = mode === 'buy' ? '买入' : '卖出';
  if (lg) {
    lg.innerHTML = data.map(d => {
      const pct = total > 0 ? (d.value / total * 100).toFixed(0) + '%' : '0%';
      return `<span class="dl"><i style="background:${d.itemStyle.color}"></i>${esc(d.name)} <em>${pct}</em></span>`;
    }).join('');
  }
  stDonut = echarts.init(elm);
  stDonut.setOption({
    animation: false,
    tooltip: {
      trigger: 'item', backgroundColor: cssVar('--card'), borderColor: cssVar('--line'), textStyle: { color: cssVar('--fg'), fontSize: 12 },
      formatter: p => esc(p.name) + '<br/>' + fmtAmt(p.value, S.base) + ' · ' + p.percent.toFixed(1) + '%'
    },
    series: [{
      type: 'pie', radius: ['50%', '72%'], center: ['50%', '50%'],
      avoidLabelOverlap: true,
      itemStyle: { borderColor: cssVar('--card'), borderWidth: 2, borderRadius: 4 },
      label: { show: false }, emphasis: { scale: false },
      data
    }],
    graphic: [
      { type: 'text', left: 'center', top: '40%', style: { text: fmtAmtC(total, S.base), textAlign: 'center', fill: cssVar('--fg'), fontSize: 15, fontWeight: 700 } },
      { type: 'text', left: 'center', top: '53%', style: { text: label, textAlign: 'center', fill: cssVar('--muted'), fontSize: 11 } }
    ]
  });
}
function renderStatsChart(st) {
  const elm = $('#st-chart'); if (!elm) return;
  if (stChart) { stChart.dispose(); stChart = null; }
  if (!window.echarts) { elm.innerHTML = '<div class="kerr" style="padding:24px 8px">图表组件加载失败（需联网）</div>'; return; }
  const y = new Date().getFullYear(); const F = fxInfo();
  const labels = [], buy = [], sell = [];
  for (let m = 1; m <= 12; m++) {
    const key = y + '-' + Core.pad(m);
    const mo = st.monthly.find(x => x.m === key);
    labels.push(m + '月');
    const g = o => mo ? ['CNY', 'USD', 'HKD'].reduce((a, c) => a + Core.toBase(o[c] || 0, c, S.base, F), 0) : 0;
    buy.push(Math.round(g(mo ? mo.buy : null)));
    sell.push(Math.round(g(mo ? mo.sell : null)));
  }
  if (!st.monthly.length) { elm.innerHTML = '<div class="kerr" style="padding:24px 8px">本年暂无交易</div>'; return; }
  stChart = echarts.init(elm);
  stChart.setOption({
    animation: false,
    grid: { left: 8, right: 8, top: 30, bottom: 2, containLabel: true },
    legend: { top: 0, right: 0, itemWidth: 10, itemHeight: 10, itemGap: 14, textStyle: { color: cssVar('--muted'), fontSize: 11 } },
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      backgroundColor: cssVar('--card'), borderColor: cssVar('--line'), textStyle: { color: cssVar('--fg'), fontSize: 12 },
      formatter: ps => {
        let h = '<b>' + (ps[0].dataIndex + 1) + '月</b>';
        ps.forEach(p => { h += '<div>' + p.marker + esc(p.seriesName) + ' ' + fmtAmt(p.value, S.base) + '</div>'; });
        return h;
      }
    },
    xAxis: { type: 'category', data: labels, axisTick: { show: false }, axisLine: { lineStyle: { color: cssVar('--line') } }, axisLabel: { color: cssVar('--muted'), fontSize: 10 } },
    yAxis: { type: 'value', splitLine: { lineStyle: { color: cssVar('--line') } }, axisLabel: { color: cssVar('--muted'), fontSize: 9, formatter: compactNum } },
    series: [
      { name: '买入', type: 'bar', data: buy, itemStyle: { color: cssVar('--up'), borderRadius: [3, 3, 0, 0] }, barMaxWidth: 16, barGap: '30%' },
      { name: '卖出', type: 'bar', data: sell, itemStyle: { color: cssVar('--down'), borderRadius: [3, 3, 0, 0] }, barMaxWidth: 16 }
    ]
  });
}

function bindClear() {
  const b = $('#btn-clear'); if (!b) return;
  let arm = 0;
  b.onclick = () => {
    if (!S.trades.length) { showToast('没有数据可清空'); return; }
    if (Date.now() - arm < 4000) {
      S.trades = []; S.seeded = true; save(); rerender();
      if (!$('#sheet').hidden) closeSheet();
      showToast('已清空全部交易');
    } else {
      arm = Date.now(); b.textContent = '再点一次确认清空'; b.style.color = 'var(--up)';
      setTimeout(() => { if (b.isConnected) { b.textContent = '清空数据'; b.style.color = ''; } }, 4000);
    }

function doExport() {
  const json = JSON.stringify(S, null, 2);
  S.lastBackup = Date.now(); save();
  openModal('备份已生成',
    `<p class="footnote" style="padding:0">共 ${S.trades.length} 笔交易。数据为明文 JSON，请妥善保管。</p>
     <textarea readonly id="exp-ta">${esc(json)}</textarea>`,
    [
      { t: '复制', fn: () => { navigator.clipboard.writeText(json).then(() => showToast('已复制到剪贴板'), () => { const ta = $('#exp-ta'); ta.focus(); ta.select(); showToast('请手动全选复制'); }); return true; } },
      { t: '下载 .json', fn: () => { downloadBackup(json); return true; } },
      { t: '关闭' }
    ]);
  renderSet();
}
function downloadBackup(json) {
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'openbook-backup-' + Core.dstr(new Date()).replace(/-/g, '') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { showToast('下载失败，请使用复制'); }
}
function handleImport(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let obj = null;
    try { obj = JSON.parse(rd.result); } catch (e) {}
    if (!obj || obj.v !== 1 || !Array.isArray(obj.trades)) { showToast('文件格式不正确'); return; }
    openModal('导入备份',
      `<p class="footnote" style="padding:0">将导入 <b>${obj.trades.length}</b> 笔交易，覆盖当前 <b>${S.trades.length}</b> 笔。此操作不可撤销，建议先导出当前数据。</p>`,
      [
        { t: '取消' },
        {
          t: '确认导入', primary: true, fn: () => {
            S = Object.assign({}, DEFAULT_STATE, obj); S.seeded = true; save();
            if (!$('#sheet').hidden) closeSheet();
            rerender(); showToast('已导入 ' + S.trades.length + ' 笔交易');
          }
        }
      ]);
  };
  rd.readAsText(file);
}
function openModal(title, bodyHtml, acts) {
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = bodyHtml;
  const ac = $('#modal-acts'); ac.innerHTML = '';
  (acts || []).forEach(a => {
    const b = document.createElement('button');
    b.className = a.primary ? 'btn btn-primary' : 'btn';
    b.textContent = a.t;
    b.onclick = () => { const keep = a.fn && a.fn(); if (!keep) closeModal(); };
    ac.appendChild(b);
  });
  $('#modal').hidden = false;
}
function closeModal() { $('#modal').hidden = true; }

function renderSheetQuote() {
  if (!sheetTc) return;
  const g = $('#sh-qgrid'); if (!g) return;
  const q = quotes[sheetTc];
  const cell = (l, v, c) => `<div><div class="l">${l}</div><div class="v num ${c || ''}">${v}</div></div>`;
  if (!q || !isFinite(q.px)) {
    g.innerHTML = cell('现价', '--') + cell('涨跌', '--') + cell('涨跌幅', '--') + cell('昨收', '--') + cell('今开', '--') + cell('最高', '--') + cell('最低', '--');

    $('#sh-px').className = 'p num'; $('#sh-chg').className = 'c num';
    return;
  }
  const cls = q.chg >= 0 ? 'up' : 'down';
  g.innerHTML = cell('现价', fmtPx(q.px)) + cell('涨跌', (q.chg > 0 ? '+' : '') + q.chg.toFixed(2), cls) + cell('涨跌幅', fmtPct(q.pct), cls)
    + cell('昨收', fmtPx(q.prev)) + cell('今开', q.open ? fmtPx(q.open) : '--') + cell('最高', q.hi ? fmtPx(q.hi) : '--') + cell('最低', q.lo ? fmtPx(q.lo) : '--');

function renderSheetPos() {
  if (!sheetTc) return;

     ${cell('现价', has ? fmtPx(q.px) : '--')}

function renderSheetTrades() {
  if (!sheetTc) return;
  const box = $('#sh-trades'); if (!box) return;
  const p = Core.calcPositions(S.trades).find(x => x.tc === sheetTc);
  const ts = (p ? p.trades : []).slice().reverse();
  const tc2 = $('#sh-tcount'); if (tc2) tc2.textContent = ts.length + ' 笔';
  if (!ts.length) { box.innerHTML = '<p class="footnote" style="padding:4px 0">暂无记录</p>'; return; }
  const F = fxInfo();
  box.innerHTML = ts.map(t => {
    const amt = t.px * t.qty;
    const base = t.cur !== S.base ? '<span class="b2">≈ ' + fmtAmt(Core.toBase(amt, t.cur, S.base, F), S.base) + '</span>' : '';
    return `<div class="trade-row"><span class="bs ${t.side}">${t.side}</span>
      <div class="tr-mid"><div class="tr-px num">${fmtPx(t.px)} × ${fmtQty(t.qty)}</div>
      <div class="tr-sub">${fmtDate(t.date)}${t.fee ? ' · 费 ' + fmtAmt(t.fee, t.cur) : ''}${t.broker ? ' · ' + esc(t.broker) : ''}${t.note ? ' · ' + esc(t.note) : ''}</div></div>
      <div class="tr-amt num">${fmtAmt(amt, t.cur)}${base}</div>

  }).join('');
  box.querySelectorAll('.del').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (b.classList.contains('arm')) {

      if (curView === 'pos') renderPos();
      if (curView === 'stats') renderStats();
      showToast('已删除该笔交易');
    } else {
      b.classList.add('arm'); b.textContent = '确认删';
      setTimeout(() => { if (b.isConnected) { b.classList.remove('arm'); b.textContent = '删除'; } }, 3000);
    }
  });
}
async function loadKline() {

  }
  $('#kchart').innerHTML = '<div class="kerr">加载中…</div>';
  const key = sheetTc + '|' + kPeriod;
  try {
    let r = kCache[key];
    if (!r) {
      r = await fetchKline(sheetTc, kPeriod, kPeriod === 'day' ? 250 : kPeriod === 'week' ? 160 : 120);
      if (!r || !r.k.length) throw new Error('empty');
      kCache[key] = r;
      if (r.qt) {   // K线响应自带最新报价, 顺带更新
        const q = r.qt, px = +q[3];
        if (px > 0) {
          quotes[sheetTc] = Object.assign({ ts: Date.now() },
            { px, prev: +q[4] || px, open: +q[5] || 0, hi: +q[33] || 0, lo: +q[34] || 0, chg: +q[31] || 0, pct: +q[32] || 0, name: q[1] || '', delayed: /^us/.test(sheetTc) });
          saveQuotes(); renderSheetQuote(); renderSheetPos();
        }
      }
    }
    renderKline(r);
  } catch (e) {
    $('#kchart').innerHTML = '<div class="kerr">无法获取K线 — 可能离线或处于受限环境（行情接口需正常网络）。<br><button class="btn" id="k-retry">重试</button></div>';
    const rb = $('#k-retry'); if (rb) rb.onclick = loadKline;
  }
}
function renderKline(r) {
  const el = $('#kchart'); if (!el) return;
  el.innerHTML = '';
  if (kChart) { kChart.dispose(); kChart = null; }
  kChart = echarts.init(el);
  const k = r.k, dates = k.map(x => x.d);
  const up = cssVar('--up'), dn = cssVar('--down'), card = cssVar('--card');
  const muted = cssVar('--muted'), line = cssVar('--line'), faint = cssVar('--faint');
  const cs = k.map(x => [x.o, x.c, x.l, x.h]);
  const vol = k.map(x => ({ value: x.v, itemStyle: { color: x.c >= x.o ? up : dn, opacity: .55 } }));
  const ma = n => k.map((_, i) => {
    if (i < n - 1) return null;
    let s = 0; for (let j = i - n + 1; j <= i; j++) s += k[j].c;
    return +(s / n).toFixed(2);
  });
  /* 用户交易 → K线标记(B/S), 同日同向合并。
     非交易日(周末/节假日)的成交自动对齐到之前最近的一根K线(10天内) */
  const p = Core.calcPositions(S.trades).find(x => x.tc === sheetTc);
  const posTrades = p ? p.trades : [];
  const dset = new Set(dates);
  const snapDate = ds => {
    if (dset.has(ds)) return ds;
    let prev = null;
    for (const d of dates) { if (d >= ds) break; prev = d; }
    if (!prev) return null;
    if ((new Date(ds) - new Date(prev)) / 864e5 > 10) return null;
    return prev;
  };
  const byd = new Map();
  const tradesByDate = {};
  for (const t of posTrades) {
    const kd = snapDate(t.date);
    if (!kd) continue;
    const kk = kd + '|' + t.side;
    const g = byd.get(kk) || { date: kd, side: t.side, px: 0, qty: 0, n: 0 };
    g.px += t.px * t.qty; g.qty += t.qty; g.n++;
    byd.set(kk, g);
    (tradesByDate[kd] = tradesByDate[kd] || []).push(t);
  }
  /* 同花顺风格小标记: 5px 价格锚点 + 10px B/S 字母(带底色描边保证可读), 标签自动避让重叠 */
  const bsData = [...byd.values()].map(g => {
    const isB = g.side === 'B';
    const txt = (isB ? 'B' : 'S') + (g.n > 1 ? g.n : '');
    return {
      value: [g.date, +(g.px / g.qty).toFixed(2)],
      symbolSize: 5,
      itemStyle: { color: isB ? up : dn, borderColor: card, borderWidth: 1 },
      label: {
        show: true, position: isB ? 'bottom' : 'top', distance: 2,
        formatter: () => txt, color: isB ? up : dn, fontSize: 10, fontWeight: 700,
        textBorderColor: card, textBorderWidth: 2
      }
    };
  });
  const startPct = Math.max(0, 100 * (1 - Math.min(90, dates.length) / Math.max(dates.length, 1)));
  /* 跨年时间轴: 每年第一根K线显示年份(如 2025), 其余 MM-DD; 密度随缩放窗口自适应 */
  const yearFirst = new Set();
  let lastY = '';
  for (const d of dates) { const y = d.slice(0, 4); if (y !== lastY) { yearFirst.add(d); lastY = y; } }
  let xStep = Math.max(1, Math.round(Math.min(90, dates.length) / 6));
  kChart.setOption({
    animation: false,
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross', lineStyle: { color: faint }, crossStyle: { color: faint } },
      backgroundColor: card, borderColor: line, textStyle: { color: cssVar('--fg'), fontSize: 12 }, padding: [8, 10],
      formatter: params => {
        const p2 = params.find(x => x.seriesType === 'candlestick') || params[0];
        if (!p2) return '';
        const i = p2.dataIndex, rr = k[i];
        if (!rr) return '';
        const chg = i > 0 && k[i - 1].c ? (rr.c - k[i - 1].c) / k[i - 1].c * 100 : 0;
        let h = `<div style="font-weight:600">${rr.d}</div><div>开 ${fmtPx(rr.o)} 收 <b style="color:${rr.c >= rr.o ? up : dn}">${fmtPx(rr.c)}</b></div><div>高 ${fmtPx(rr.h)} 低 ${fmtPx(rr.l)}</div><div>量 ${fmtVol(rr.v)} · <span style="color:${chg >= 0 ? up : dn}">${fmtPct(chg)}</span></div>`;
        const ts = tradesByDate[rr.d];
        if (ts) for (const t of ts) {
          h += `<div style="margin-top:4px;padding-top:4px;border-top:1px dashed ${line}"><b style="color:${t.side === 'B' ? up : dn}">${t.side === 'B' ? '买入' : '卖出'}</b> ${fmtPx(t.px)}×${fmtQty(t.qty)}${t.broker ? ' · ' + esc(t.broker) : ''}</div>`;
        }
        return h;
      }
    },
    grid: [{ left: 6, right: 8, top: 30, height: '54%' }, { left: 6, right: 8, top: '74%', height: '14%' }],
    xAxis: [
      { type: 'category', data: dates, boundaryGap: true, axisTick: { show: false }, axisLine: { lineStyle: { color: line } }, axisLabel: { color: muted, fontSize: 9, interval: (idx, val) => yearFirst.has(val) || idx % xStep === 0, formatter: val => yearFirst.has(val) ? val.slice(0, 4) : (val.length > 7 ? val.slice(5) : val) } },
      { type: 'category', gridIndex: 1, data: dates, axisTick: { show: false }, axisLabel: { show: false }, axisLine: { lineStyle: { color: line } } }
    ],
    yAxis: [
      { scale: true, splitNumber: 4, splitLine: { lineStyle: { color: line } }, axisLabel: { color: muted, fontSize: 9 } },
      { gridIndex: 1, splitNumber: 2, axisLabel: { show: false }, splitLine: { show: false } }
    ],
    dataZoom: [{ type: 'inside', xAxisIndex: [0, 1], start: startPct, end: 100 }],
    series: [
      { name: 'K线', type: 'candlestick', data: cs, itemStyle: { color: up, color0: dn, borderColor: up, borderColor0: dn } },
      { name: '买卖点', type: 'scatter', data: bsData, symbol: 'circle', symbolSize: 5, z: 5, emphasis: { disabled: true }, labelLayout: { hideOverlap: true } },
      { name: 'MA5', type: 'line', data: ma(5), showSymbol: false, lineStyle: { width: 1.2, color: '#e0a832' }, itemStyle: { color: '#e0a832' }, emphasis: { disabled: true } },
      { name: 'MA10', type: 'line', data: ma(10), showSymbol: false, lineStyle: { width: 1.2, color: '#b678f0' }, itemStyle: { color: '#b678f0' }, emphasis: { disabled: true } },
      { name: 'MA20', type: 'line', data: ma(20), showSymbol: false, lineStyle: { width: 1.2, color: '#4aa3f0' }, itemStyle: { color: '#4aa3f0' }, emphasis: { disabled: true } },
      { name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: vol, barWidth: '58%' }
    ]
  });
  kChart.on('datazoom', () => {
    updateMaLegend(k);
    try {
      const dz = kChart.getOption().dataZoom[0];
      const vis = (dz.endValue != null ? dz.endValue : dates.length - 1) - (dz.startValue != null ? dz.startValue : 0) + 1;
      xStep = Math.max(1, Math.round(vis / 6));
    } catch (e) {}
  });
  updateMaLegend(k);
}
function updateMaLegend(k) {
  const el = $('#ma-legend'); if (!el || !kChart || !k || !k.length) return;
  let end = k.length - 1;
  try { const dz = kChart.getOption().dataZoom[0]; if (dz && dz.endValue != null) end = dz.endValue; } catch (e) {}
  end = Math.max(0, Math.min(end, k.length - 1));
  const one = n => {
    let s = 0, cnt = 0;
    for (let i = Math.max(0, end - n + 1); i <= end; i++) { s += k[i].c; cnt++; }
    return cnt ? (s / cnt).toFixed(2) : '--';
  };
  el.innerHTML = `<span style="color:#e0a832">MA5 <b>${one(5)}</b></span><span style="color:#b678f0">MA10 <b>${one(10)}</b></span><span style="color:#4aa3f0">MA20 <b>${one(20)}</b></span><span style="margin-left:auto;color:var(--faint)">${k[end].d}</span>`;
}

/* ===== 启动 ===== */
function boot() {
  applyTheme();
  if (location.hash === '#dark') document.documentElement.dataset.theme = 'dark';
  if (!S.seeded && !S.trades.length) { S.trades = demoTrades(); S.seeded = true; save(); }
  initAdd();
  $$('#tabs button').forEach(b => b.onclick = () => showView(b.dataset.view));
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });   // 桌面对话框遮罩点击关闭
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  window.addEventListener('resize', () => { if (kChart) kChart.resize(); if (stChart) stChart.resize(); });
  onData = () => rerender();
  onBusy = busy => { const el = document.getElementById('btn-refresh'); if (el) el.classList.toggle('spin', busy); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - net.at > 60e3) refreshQuotes(); });
  /* 浏览器历史导航: 视图/详情页压栈, iOS 边缘右滑(或浏览器返回)经 popstate 驱动回退 */
  try { history.replaceState({ v: 'pos' }, ''); } catch (e) {}
  window.addEventListener('popstate', e => {
    const st = e.state || { v: 'pos' };
    if (st.sheet) {
      if (!$('#sheet').hidden && sheetTc === st.sheet) return;
      if (!$('#sheet').hidden) closeSheet(true);
      openSheet(st.sheet, true);
    } else {
      if (!$('#sheet').hidden) closeSheet(true);
      if (st.v && st.v !== curView) showView(st.v, true);
    }
  });
  showView('pos', true);
  const h = location.hash.slice(1);
  if (h && h !== 'dark' && S.trades.some(t => t.tc === h)) openSheet(h);   // 深链: #股票代码 直达详情
  /* 只读调试钩子: window.__cj.kChart / .stChart / .stDonut / .S */
  window.__cj = { get S() { return S; }, get kChart() { return kChart; }, get stChart() { return stChart; }, get stDonut() { return stDonut; } };
  refreshQuotes();
}
boot();
